name: Export research source
on:
  push:
    branches: [research/native-roms-20261002]
    paths: [.github/workflows/export-research-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: home-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2889f904115a316da501d25ffaa7301454a4a722
          persist-credentials: false
      - name: Acquire pinned documentation wheels only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/docs-acquire"
          "$RUNNER_TEMP/docs-acquire/bin/pip" download --only-binary=:all: \
            --python-version 3.13 --implementation cp --abi cp313 --abi abi3 --abi none \
            --platform manylinux_2_17_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 \
            -r tools/requirements-docs.txt -d "$RUNNER_TEMP/docs-wheels"
          cd "$RUNNER_TEMP/docs-wheels"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-docs-wheels
          path: ${{ runner.temp }}/docs-wheels/
          retention-days: 1
          if-no-files-found: error
# Acquisition only; no firmware or emulator tests. Strict rendering runs locally.
