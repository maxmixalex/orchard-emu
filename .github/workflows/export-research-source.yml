name: Export research source
on:
  push:
    branches: [research/native-roms-20261002]
    paths: [.github/workflows/export-research-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: home-docker
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6372cbe021713a6523551ec604af65a244dc44e9
          persist-credentials: false
      - name: Export source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/orchard-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-source-6372cbe
          path: ${{ runner.temp }}/orchard-source.tar.gz
          retention-days: 1
          if-no-files-found: error
# Source transport only; no emulator execution or firmware acquisition.
