name: Export research source
on:
  push:
    branches: [research/native-roms-20261002]
    paths: [.github/workflows/export-research-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: home-docker
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2889f904115a316da501d25ffaa7301454a4a722
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export source and acquire dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orchard-inputs" "$RUNNER_TEMP/orchard-dependencies"
          git archive --format=tar.gz --output="$RUNNER_TEMP/orchard-inputs/orchard-source.tar.gz" HEAD
          cd "$RUNNER_TEMP/orchard-dependencies"
          printf '{"name":"orchard-frontend-dependencies","version":"1.0.0","private":true,"type":"module"}\n' > package.json
          npm install --save-exact --ignore-scripts react react-dom @mantine/core @mantine/hooks i18next react-i18next react-simple-keyboard
          npm install --save-dev --save-exact --ignore-scripts esbuild
          npm ls --depth=0
          tar -czf "$RUNNER_TEMP/orchard-inputs/frontend-dependencies.tar.gz" package.json package-lock.json node_modules
          sha256sum "$RUNNER_TEMP/orchard-inputs/"*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-react-development-inputs
          path: ${{ runner.temp }}/orchard-inputs/
          retention-days: 1
          if-no-files-found: error
# Acquisition only; all implementation, profiling and emulator tests run locally.
