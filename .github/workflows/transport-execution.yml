name: Transport verified execution optimization
on:
  push:
    branches: [transport/execution-speed-20261003]
    paths: [.github/workflows/transport-execution.yml]
permissions:
  contents: write
jobs:
  transport:
    runs-on: home-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Reconstruct exactly the locally tested source
        shell: bash
        run: |
          set -euo pipefail
          export DELTA="$RUNNER_TEMP/orchard-execution.xz"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path('_source-transport')
          assert len(list(root.iterdir())) == 5
          data = b''.join((root / f'part-{i}').read_bytes() for i in range(5))
          assert len(data) == 12012
          assert hashlib.sha256(data).hexdigest() == '1e3f860376041387fb1664f166b3c0afde44ee39718a0bfc035f1c986f93c63c'
          Path(os.environ['DELTA']).write_bytes(data)
          PY
          git checkout --detach 2042ad8d05be5d70af2db01f9992c2b17e3e030e
          python3 - <<'PY'
          import hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          data = Path(os.environ['DELTA']).read_bytes()
          assert hashlib.sha256(data).hexdigest() == '1e3f860376041387fb1664f166b3c0afde44ee39718a0bfc035f1c986f93c63c'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(data, max_length=1000001)
          assert decoder.eof and not decoder.unused_data and len(raw) <= 1000000
          manifest = json.loads(raw)
          assert manifest['schema'] == 1
          assert manifest['base'] == '2042ad8d05be5d70af2db01f9992c2b17e3e030e'
          assert manifest['base_tree'] == '41120dab8279216cd962d7cfa78c35cac7f51751'
          assert manifest['tree'] == '825f2271c7c4b6c30303248e3edcfba9d698541a'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == manifest['base_tree']
          assert len(manifest['changes']) == 16
          seen = set()
          for item in manifest['changes']:
              name = item['path']; rel = PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts and name not in seen
              seen.add(name)
              path = Path(name)
              assert not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == item['old'], name
              lines = (old or b'').decode('utf-8').splitlines(keepends=True)
              end = len(lines)
              for start, stop, value in reversed(item['edits']):
                  assert 0 <= start <= stop <= end and isinstance(value, str)
                  lines[start:stop] = value.splitlines(keepends=True)
                  end = start
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['new'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['git', 'add', '--', *sorted(seen)], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == manifest['tree']
          print('16 source files and complete tested tree verified')
          PY
          # Apply the workflow change separately through the authorized connector.
          git restore --source=2042ad8d05be5d70af2db01f9992c2b17e3e030e --staged --worktree .github/workflows/build.yml
          test "$(git write-tree)" = 0c2e64ae8e97dcd38c7b7f423f32d29ab27b0852
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'perf: accelerate checked memory and non-faulting ARM execution' \
            -m 'Add exact-width memory reads and 1 KiB host translation memoization that rechecks live descriptors, permissions, FCSE and NOR mode. Keep all fallible instructions on complete checkpoint rollback. Retain uncached and full-checkpoint reference paths; no virtual time, instructions or firmware are skipped.' \
            -m 'Locally validated before publication: 407540 assertions per native/test-WASM host; nine Release, sanitizer and reference suites; 29 clean analyzer reports; 17075 Unicorn cases. Both original-NOR HOME arithmetic witnesses pass two cold starts per host. Full identical workloads are about 1.30x faster than 2042ad8; direct 20M cold medians are 7.19x and 7.33x faster than 78ef22f. These are local workload timings, not hardware ratios. No firmware or private evidence is committed.'
          git push origin HEAD:refs/heads/integration/execution-speed-20261003
          git rev-parse HEAD HEAD^{tree}
# Data-only transfer of locally tested source; no firmware acquisition or execution.
# Main is updated separately after connector verification.
