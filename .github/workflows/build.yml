name: Build

# Validate pull requests on GitHub-hosted runners before merging to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check and install runner build tools
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          missing=()
          for package in ca-certificates git clang libclang-rt-dev lld cmake ninja-build python3-venv golang-go; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} == 0 )); then exit 0; fi
          privilege=()
          if (( EUID != 0 )); then
            sudo -n true
            privilege=(sudo -n -E)
          fi
          export DEBIAN_FRONTEND=noninteractive
          "${privilege[@]}" apt-get -o Acquire::Retries=3 update
          "${privilege[@]}" apt-get -o Acquire::Retries=3 install -y --no-install-recommends "${missing[@]}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build native core and CLI
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          build/orchard models
          ctest --test-dir build --output-on-failure
      - name: Sanitizer regression
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug -DORCHARD_SANITIZE=ON
          cmake --build build-sanitize --parallel
          ctest --test-dir build-sanitize --output-on-failure
      - name: Reference execution regression
        run: |
          cmake -S . -B build-reference -G Ninja -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Release -DORCHARD_REFERENCE=ON
          cmake --build build-reference --parallel
          ctest --test-dir build-reference --output-on-failure
      - name: Analyze native C
        shell: bash
        run: |
          rm -rf build/analysis
          mkdir -p build/analysis
          for file in src/*.c app/main.c tests/*.c tools/probe-gpio-window.c tools/usb-session.c tools/cpu-oracle.c tools/checkpoint-replay.c tools/cpu-throughput.c; do
            report="build/analysis/${file%.c}.plist"
            mkdir -p "$(dirname "$report")"
            clang --analyze -std=c17 -Wall -Wextra -Werror -Iinclude -Isrc "$file" \
              -o "$report"
          done
          python3 - <<'PYCODE'
          import pathlib, plistlib
          analysis = pathlib.Path("build/analysis")
          reports = list(analysis.rglob("*.plist"))
          sources = list(pathlib.Path("src").glob("*.c")) + [pathlib.Path("app/main.c"), *pathlib.Path("tests").glob("*.c"), pathlib.Path("tools/probe-gpio-window.c"), pathlib.Path("tools/usb-session.c"), pathlib.Path("tools/cpu-oracle.c"), pathlib.Path("tools/checkpoint-replay.c"), pathlib.Path("tools/cpu-throughput.c")]
          assert {p.relative_to(analysis).as_posix() for p in reports} == {p.with_suffix(".plist").as_posix() for p in sources}, "Missing analyzer output"
          issues = {p.relative_to(analysis).as_posix(): plistlib.loads(p.read_bytes())["diagnostics"] for p in reports}
          assert not any(issues.values()), issues
          PYCODE
      - name: Build browser core
        run: |
          npm run check
          npm run test:tools
          npm run build
          npm run test:wasm
          npm run test:trace
          npm run test:web
          npm run test:skins
          npm run test:calculator
          npm run test:pages
      - name: Check HP39 full-ROM receiver
        working-directory: tools/hp39-romstream/receiver
        run: |
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/orchard-hp39-receiver.exe .
      - name: Browser receiver and production Worker regression
        run: |
          node tests/timer-receiver.mjs
          python3 -m venv build/browser-venv
          build/browser-venv/bin/pip install -r tools/requirements-browser.txt
          build/browser-venv/bin/python tests/browser-components.py
          build/browser-venv/bin/python tests/sd-storage-browser.py
          build/browser-venv/bin/python tests/browser-landscape.py
          build/browser-venv/bin/python tests/buzzer-browser.py
          build/browser-venv/bin/python tests/browser-sd-files.py
          build/browser-venv/bin/python tests/browser-keyboard.py
          build/browser-venv/bin/python tests/browser-lcd.py
          build/browser-venv/bin/python tests/browser-display.py
          build/browser-venv/bin/python tests/browser-sd-directory.py
          build/browser-venv/bin/python tests/browser-sd-sync-cancel.py
          build/browser-venv/bin/python tests/rom-storage-browser.py
          build/browser-venv/bin/python tests/browser-host-bridge.py
          build/browser-venv/bin/python tests/browser-host-bridge-network.py
          build/browser-venv/bin/python tests/browser-worker.py
          build/browser-venv/bin/python tests/browser-stop-recovery.py
          build/browser-venv/bin/python tests/browser-stop-recovery.py --diagnostic-trace
      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-browser-evidence
          path: |
            build/browser-worker.json
            build/browser-ui.png
            build/browser-stop-recovery.json
            build/browser-stop-recovery-before.png
            build/browser-stop-trace-recovery.json
            build/browser-stop-trace-recovery-before.png
            build/offline-initial.png
            build/ui-keyboard-zh.png
            build/ui-traditional-zh.png
            build/ui-files-zh.png
            build/test-capture.png
            build/landscape/
            build/buzzer-browser.json
            build/keyboard-r22-*.png
            build/lcd-browser/
            build/display-r23/
            build/rom-storage-browser.json
            build/host-bridge-r22-mobile.png
            build-r22/directory-sd/browser-result.json
            build-r22/directory-sd/directory-mobile*.png
            build-r23/directory-sd/browser-result.json
            build-r23/directory-sd/directory-mobile*.png
            build-r24/sd-sync-cancel/
            build-r20/sd-files/browser-result.json
            build-r20/sd-files/browser-mobile.png
            build-r20/sd-files/browser-mobile-zh.png
          retention-days: 7
          if-no-files-found: warn
      - name: Test and package loopback host
        run: |
          npm run test:host
          npm run build:host
          ORCHARD_HOST_ROOT=build/host-package npm run test:host
          node build/host-package/host/run.mjs --help
          node build/host-package/host/bridge.mjs --help
      - name: Independent CPU differential (developer-only dependency)
        run: |
          npm run build:oracle
          python3 -m venv build/oracle-venv
          build/oracle-venv/bin/pip install -r tools/requirements-oracle.txt
          build/oracle-venv/bin/python tools/check-unicorn.py
      - name: Build documentation
        run: |
          python3 tools/check-docs.py
          python3 -m venv build/docs-venv
          build/docs-venv/bin/pip install -r tools/requirements-docs.txt
          build/docs-venv/bin/zensical build --strict
          python3 tools/build-pages.py
      - name: Upload production web build
        uses: actions/upload-artifact@v4
        with:
          name: orchard-web
          path: dist/
          if-no-files-found: error
      - name: Upload tested Pages site
        uses: actions/upload-artifact@v4
        with:
          name: orchard-pages
          path: site/
          if-no-files-found: error
      - name: Upload standalone host prototype
        uses: actions/upload-artifact@v4
        with:
          name: orchard-host
          path: build/host-package/
          if-no-files-found: error
