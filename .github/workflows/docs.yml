name: Pages
on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build run for the current main commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: orchard-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Select successful trusted Build at current main
        id: source
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            core.setOutput('ready', 'false');
            const run_id = Number(context.payload.workflow_run?.id || process.env.BUILD_RUN_ID);
            if (!Number.isSafeInteger(run_id) || run_id < 1) throw new Error('Invalid Build run ID');
            const repo = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id});
            if (run.name !== 'Build' || run.path !== '.github/workflows/build.yml' ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                !['push', 'workflow_dispatch'].includes(run.event) || run.head_branch !== 'main' ||
                run.repository.id !== context.payload.repository.id ||
                run.head_repository.id !== context.payload.repository.id ||
                !/^[a-f0-9]{40}$/.test(run.head_sha)) {
              throw new Error('Refusing artifacts not produced by a successful trusted main Build');
            }
            const {data: head} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            if (head.object.sha !== run.head_sha) {
              core.notice('Skip superseded Build; never publish an older revision over current main');
              return;
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('run_id', String(run.id));
            core.setOutput('ready', 'true');
      - uses: actions/checkout@v6
        if: steps.source.outputs.ready == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Download tested complete Pages artifact
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: orchard-pages
          path: site
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify immutable build identity and assets
        if: steps.source.outputs.ready == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 tools/verify-pages.py --site site --revision "$SOURCE_SHA"
      - uses: actions/upload-pages-artifact@v4
        if: steps.source.outputs.ready == 'true'
        with:
          path: site
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Recheck current main before publication
        id: head
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            const {data: head} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            core.setOutput('current', String(head.object.sha === process.env.SOURCE_SHA));
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.head.outputs.current == 'true'
      - name: Verify all published emulator assets
        if: steps.head.outputs.current == 'true'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 tools/verify-pages.py --url "$PAGES_URL" --revision "$SOURCE_SHA"
