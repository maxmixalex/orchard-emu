name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'tools/requirements-docs.txt'
      - 'tools/check-docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orchard-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: home-docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build strict Zensical site
        run: |
          python3 tools/check-docs.py
          python3 -m venv "$RUNNER_TEMP/orchard-docs-venv"
          "$RUNNER_TEMP/orchard-docs-venv/bin/pip" install --disable-pip-version-check -r tools/requirements-docs.txt
          "$RUNNER_TEMP/orchard-docs-venv/bin/zensical" build --strict
          test -f site/index.html
          printf '%s\n' "$GITHUB_SHA" > site/revision.txt
          test -z "$(find site -type f \( -iname '*.bin' -o -iname '*.raw' -o -iname '*.rom' -o -iname '*.xz' \) -print -quit)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: home-docker
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published documentation
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGES_URL%/}/"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 25 --retry 5 --retry-delay 3 --retry-all-errors \
            "${base}?revision=${GITHUB_SHA}" -o "$RUNNER_TEMP/orchard-index.html"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 25 --retry 5 --retry-delay 3 --retry-all-errors \
            "${base}development/roms/?revision=${GITHUB_SHA}" -o "$RUNNER_TEMP/orchard-roms.html"
          grep -q 'Orchard' "$RUNNER_TEMP/orchard-index.html"
          grep -q '4899102743d3420dc517ae1b489fe2405229be616dbdb1b9f00cc1d0aeae1937' "$RUNNER_TEMP/orchard-roms.html"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 25 --retry 5 --retry-delay 3 --retry-all-errors \
            "${base}development/native-roms/?revision=${GITHUB_SHA}" -o "$RUNNER_TEMP/orchard-native-roms.html"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 25 --retry 5 --retry-delay 3 --retry-all-errors \
            "${base}revision.txt?revision=${GITHUB_SHA}" -o "$RUNNER_TEMP/orchard-revision.txt"
          grep -q 'dfa544617039e1bff0f62b9f51a943e57ff756d12bb81478de7aec41a5b73a28' "$RUNNER_TEMP/orchard-native-roms.html"
          test "$(cat "$RUNNER_TEMP/orchard-revision.txt")" = "$GITHUB_SHA"
