name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'tools/requirements-docs.txt'
      - 'tools/check-docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orchard-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: home-docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build strict Zensical site
        run: |
          python3 tools/check-docs.py
          python3 -m venv "$RUNNER_TEMP/orchard-docs-venv"
          "$RUNNER_TEMP/orchard-docs-venv/bin/pip" install --disable-pip-version-check -r tools/requirements-docs.txt
          "$RUNNER_TEMP/orchard-docs-venv/bin/zensical" build --strict
          test -f site/index.html
          test -z "$(find site -type f \( -iname '*.bin' -o -iname '*.raw' -o -iname '*.rom' -o -iname '*.xz' \) -print -quit)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: home-docker
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
