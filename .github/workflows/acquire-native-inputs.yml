name: Acquire native research inputs
on:
  workflow_dispatch:
  push:
    branches: [research/native-roms-20261002]
    paths: [.github/workflows/acquire-native-inputs.yml]
permissions:
  contents: read
jobs:
  acquire:
    if: github.repository == 'zyf722/orchard-emu' && github.event.repository.private == true
    runs-on: home-docker
    timeout-minutes: 3
    steps:
      - name: Acquire the archived emulator ROM for offline format inspection
        env:
          TARGET: ${{ runner.temp }}/rom-format-research
        run: |
          mkdir -p "$TARGET"
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          from urllib.parse import urlsplit
          url = 'https://www.hpcalc.org/hp49/pc/rom/hp4950emurom.zip'
          out = pathlib.Path(os.environ['TARGET'])
          with urllib.request.urlopen(url, timeout=60) as response:
              if urlsplit(response.url).scheme != 'https': raise ValueError('HTTPS required')
              data = response.read(1000001)
          if len(data) != 662123: raise ValueError('Archive size differs from preservation listing')
          (out / 'hp4950emurom.zip').write_bytes(data)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              member = archive.getinfo('rom.49g')
              if member.file_size != 2097152: raise ValueError('Unexpected image size')
              image = archive.read(member)
          report = dict(source=url, archive_sha256=hashlib.sha256(data).hexdigest(),
                        image_sha256=hashlib.sha256(image).hexdigest(), image_size=len(image))
          (out / 'identity.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-rom-format-research
          path: ${{ runner.temp }}/rom-format-research/
          retention-days: 1
          if-no-files-found: error
# Binary acquisition only. No emulator execution, no firmware in Git or Pages.
