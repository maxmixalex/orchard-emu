name: Transport verified scheduler and sessions
on:
  push:
    branches: [transport/scheduler-session-20261003]
    paths: [.github/workflows/transport-scheduler-session.yml]
permissions:
  contents: write
jobs:
  transport:
    runs-on: home-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Reconstruct exact locally tested source
        shell: bash
        run: |
          set -euo pipefail
          export DELTA="$RUNNER_TEMP/orchard-scheduler-session.xz"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path('_source-transport')
          assert len(list(root.iterdir())) == 5
          data = b''.join((root / f'part-{i}').read_bytes() for i in range(5))
          assert len(data) == 21956
          assert hashlib.sha256(data).hexdigest() == '3b797af316a4ec23f58b4c443663c932494d0e3c0fb806859aee84642f3d390d'
          Path(os.environ['DELTA']).write_bytes(data)
          PY
          git checkout --detach 980e1ec255f57884b26f47e8e212c7ccb60a8894
          python3 - <<'PY'
          import hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          data = Path(os.environ['DELTA']).read_bytes()
          assert hashlib.sha256(data).hexdigest() == '3b797af316a4ec23f58b4c443663c932494d0e3c0fb806859aee84642f3d390d'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(data, max_length=1000001)
          assert decoder.eof and not decoder.unused_data and len(raw) <= 1000000
          manifest = json.loads(raw)
          assert manifest['schema'] == 1
          assert manifest['base'] == '980e1ec255f57884b26f47e8e212c7ccb60a8894'
          assert manifest['base_tree'] == '825f2271c7c4b6c30303248e3edcfba9d698541a'
          assert manifest['tree'] == '6c340034a27abda3f23f701bb12136a376ea0592'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == manifest['base_tree']
          assert len(manifest['changes']) == 33
          seen = set()
          for item in manifest['changes']:
              name = item['path']; rel = PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts and name not in seen
              seen.add(name)
              path = Path(name)
              assert not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == item['old'], name
              lines = (old or b'').decode('utf-8').splitlines(keepends=True)
              end = len(lines)
              for start, stop, value in reversed(item['edits']):
                  assert 0 <= start <= stop <= end and isinstance(value, str)
                  lines[start:stop] = value.splitlines(keepends=True)
                  end = start
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['new'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['git', 'add', '--', *sorted(seen)], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == manifest['tree']
          print('All 33 file hashes and complete local source tree verified')
          PY
          # Apply workflow changes separately through the authorized connector.
          git restore --source=980e1ec255f57884b26f47e8e212c7ccb60a8894 --staged --worktree .github/workflows/build.yml
          test "$(git write-tree)" = c70c7c20f691169f39a87a26a4badbff87ecb406
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m 'feat: schedule peripheral events and add portable saved sessions' \
            -m 'Preserve the exact per-instruction guest timeline while deferring unchanged peripheral phase accounting until the next transition or MMIO/run boundary. Keep a per-tick reference. Add versioned, bounded, two-phase checkpoint import without immutable NOR, plus user Save/Load session controls with model and ROM SHA-256 checks. Restore stays paused.' \
            -m 'Locally verified: 430179 assertions per native/test-WASM host, 11 Release/sanitizer/reference suites, 34 clean analyzer units, 17075 Unicorn cases, and session/Worker/skin/publication checks. Both original-NOR arithmetic witnesses replay twice per host. Save after 1+2, restore, then 7*8 matches uninterrupted state and cross-host continuation. Identical full workloads are about 1.4x faster than 980e1ec. New strict docs and remote acceptance remain separate; no firmware/private evidence added.'
          git push origin HEAD:refs/heads/integration/scheduler-session-20261003
          git rev-parse HEAD HEAD^{tree}
# Source data transport only, not guest execution or CI-based debugging.
# Main is updated separately after complete tree verification.
